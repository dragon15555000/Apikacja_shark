title = "Repo Security & Network Topology Guard"

[extend]
useDefault = true

[[rules]]
id = "private-ip-range-10"
description = "Wykryto prywatny adres IP z sieci 10.0.0.0/8 (ryzyko wycieku topologii)"
regex = '''\b10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}\b'''
tags = ["network", "topology"]

[[rules]]
id = "private-ip-range-192-168"
description = "Wykryto prywatny adres IP z sieci 192.168.0.0/16 (ryzyko wycieku topologii)"
regex = '''\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["network", "topology"]

[[rules]]
id = "private-ip-range-172"
description = "Wykryto prywatny adres IP z sieci 172.16.0.0/12 (ryzyko wycieku topologii)"
regex = '''\b172\.(?:1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["network", "topology"]

[allowlist]
description = "Dozwolone przykłady w dokumentacji, testach i szablonach"
paths = [
  '''^tests/''',
  '''^\.gitleaks\.toml$''',
  '''^docs/infrastructure/server-map\.yaml$''',
]
regexes = [
  '''staging\.example\.internal''',
  '''127\.0\.0\.1''',
  '''0\.0\.0\.0''',
]
