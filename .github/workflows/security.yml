name: Security & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --redact --verbose
          else
            echo "Instalacja tymczasowa gitleaks..."
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
            /tmp/gitleaks detect --redact --verbose
          fi
